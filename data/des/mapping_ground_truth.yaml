# data/des/mapping_ground_truth.yaml —— P3 映射 GT（demo 口径，docs/P3-映射治理设计_v0.1.md §3）
#
# 标注方式（设计 §3.5 裁剪）：单轮标注（数据角色）+ Rose 复核（待办，文末注明）；正式口径（真实企业）
# 为 ≥300 条/域 + ≥2 人独立标注 + 仲裁，P3 demo 不启用。
# 真值口径 = 设计语义：照 P1b 表结构（data/des/des_industry_template.yaml 18 表 DDL）+ 本体对象定义
# （src/ontology/des_objects.py 5 个 DES 对象 + src/ontology/objects.py S1 对象）。
# 单位口径：一条「源表字段 → 本体 target」= 一个 GT 条目（映射条目，非问答级）。
# 覆盖：18 表全表（9 主数据 + 9 事务），7 object / 51 attribute / 4 link = 62 条。
# 三类真值：object 用已注册对象；attribute 用已注册对象字段；link 用已注册链接（本域 = material.codes）。
version: "0.1"
domain: "manufacturing"

labeling:
  method: "single-pass"     # demo 口径（设计 §3.5）：单轮标注 + Rose 复核
  annotator: "jack"         # 数据角色单轮标注
  reviewer: "rose"          # Rose 复核（全量一致性 + 冲突仲裁 + 抽样抽审）——2026-08-21 复核通过
  reviewed: true
  labeled_at: "2026-08-21"

entries:
  # ============ erp 系统 ============
  - source_table: "erp.MARA"
    source_field: "MATNR"
    kind: "object"
    gt_target: "Material"
    note: "MARA 物料主数据 → Material 对象（des_objects.py Material.source_table=material；权威列 ERP.MARA.MATNR）"
  - source_table: "erp.MARA"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "Material.matnr 权威列 ERP.MARA.MATNR（对象定义注释）"
  - source_table: "erp.MARA"
    source_field: "MAKTX"
    kind: "attribute"
    gt_target: "name"
    note: "Material.name 权威列 ERP.MARA.MAKTX（物料描述）"
  - source_table: "erp.MARA"
    source_field: "MTART"
    kind: "attribute"
    gt_target: "material_type"
    note: "Material.material_type 权威列 ERP.MARA.MTART（FERT/HALB/ROH/VERP/HAWA）"
  - source_table: "erp.MARA"
    source_field: "BISMT"
    kind: "attribute"
    gt_target: "old_code"
    note: "Material.old_code 权威列 ERP.MARA.BISMT（旧码，仅一物多码行非空；注入字段）"
  - source_table: "erp.MARA"
    source_field: "MEINS"
    kind: "attribute"
    gt_target: "base_unit"
    note: "Material.base_unit 权威列 ERP.MARA.MEINS（基本计量单位，门禁 D3 与 WMMD 一致）"
  - source_table: "erp.MARA"
    source_field: "MATKL"
    kind: "attribute"
    gt_target: "material_group"
    note: "Material.material_group 权威列 ERP.MARA.MATKL（物料组）"
  - source_table: "erp.MARA"
    source_field: "ERDAT"
    kind: "attribute"
    gt_target: "created_date"
    note: "Material.created_date 权威列 ERP.MARA.ERDAT（创建日期，seed 确定性）"
  - source_table: "erp.MARA"
    source_field: "MATNR"
    kind: "link"
    gt_target: "material.codes"
    note: "主码族 erp/plm（wms 采用主码）→ hasCode 编码归属（P1a §1.3：3 系统编码 → 1 概念）"
  - source_table: "erp.MARA"
    source_field: "BISMT"
    kind: "link"
    gt_target: "material.codes"
    note: "旧码族 BISMT → legacy Code 行（materialize._CODES_SQL code_space=legacy），hasCode 归属"
  - source_table: "erp.KNA1"
    source_field: "KUNNR"
    kind: "object"
    gt_target: "Customer"
    note: "KNA1 客户主数据 → Customer 对象（CU- 定宽客户号，S1 Customer 复用同注册表；真值保守）"
  - source_table: "erp.KNA1"
    source_field: "KUNNR"
    kind: "attribute"
    gt_target: "customer_id"
    note: "Customer.customer_id 对应 KNA1.KUNNR（客户号）"
  - source_table: "erp.KNA1"
    source_field: "NAME1"
    kind: "attribute"
    gt_target: "name"
    note: "Customer.name 对应 KNA1.NAME1（客户名称）"
  - source_table: "erp.KNA1"
    source_field: "ORT01"
    kind: "attribute"
    gt_target: "region"
    note: "Customer.region=所在城市，对应 KNA1.ORT01（城市）；字段名 region 语义=城市，口径以对象定义为准"
  - source_table: "erp.KNA1"
    source_field: "KTOKD"
    kind: "attribute"
    gt_target: "segment"
    note: "客户账户组 KTOKD（0001/0002/0003=零售/中小企业/集团）≈ Customer.segment（retail/sme/corporate），保守映射待 Rose 复核"
  - source_table: "erp.MARC"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "MARC 工厂级物料数据，MATNR 为物料引用 → Material.matnr（引用映射）"
  - source_table: "erp.MARC"
    source_field: "WERKS"
    kind: "attribute"
    gt_target: "factory"
    note: "工厂 WERKS（PL01/PL02）→ InventoryLocation.factory（指标维度 factory 同源）"
  - source_table: "erp.MARD"
    source_field: "MATNR"
    kind: "object"
    gt_target: "InventoryLocation"
    note: "MARD 地点粒度库存 → InventoryLocation 对象（des_objects.py source_table=erp.MARD，PK 派生 WERKS|LGORT）"
  - source_table: "erp.MARD"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "MARD.MATNR 为物料引用 → Material.matnr（引用映射）"
  - source_table: "erp.MARD"
    source_field: "WERKS"
    kind: "attribute"
    gt_target: "factory"
    note: "InventoryLocation.factory 权威列 ERP.MARD.WERKS（指标维度 factory）"
  - source_table: "erp.MARD"
    source_field: "LGORT"
    kind: "attribute"
    gt_target: "location"
    note: "InventoryLocation.location 权威列 ERP.MARD.LGORT（指标维度 location）"
  - source_table: "erp.MAST"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "MAST BOM 头，MATNR 父物料引用 → Material.matnr（引用映射）"
  - source_table: "erp.MAST"
    source_field: "WERKS"
    kind: "attribute"
    gt_target: "factory"
    note: "MAST.WERKS 工厂 → InventoryLocation.factory（引用映射）"
  - source_table: "erp.STPO"
    source_field: "IDNRK"
    kind: "attribute"
    gt_target: "matnr"
    note: "STPO BOM 组件 IDNRK 引用物料 → Material.matnr（组件物料引用）"
  - source_table: "erp.STPO"
    source_field: "MEINS"
    kind: "attribute"
    gt_target: "base_unit"
    note: "STPO.MEINS 随组件物料复制 MARA.MEINS（generate.py meins_by_matnr）→ Material.base_unit"
  - source_table: "erp.VBAK"
    source_field: "KUNNR"
    kind: "attribute"
    gt_target: "customer_id"
    note: "VBAK 销售订单客户 FK → Customer.customer_id（引用映射；DES 未单独注册订单对象，保守真值）"
  - source_table: "erp.VBAP"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "VBAP 销售订单行物料引用 → Material.matnr（引用映射）"
  - source_table: "erp.VBAP"
    source_field: "MEINS"
    kind: "attribute"
    gt_target: "base_unit"
    note: "VBAP.MEINS 随物料复制 MARA.MEINS → Material.base_unit（引用映射）"

  # ============ mes 系统 ============
  - source_table: "mes.MPLA"
    source_field: "MPLA_ID"
    kind: "object"
    gt_target: "Material"
    note: "MPLA 生产物料主数据 → Material 对象（MES 视图，1:1 对齐 MARA）"
  - source_table: "mes.MPLA"
    source_field: "MPLA_ID"
    kind: "attribute"
    gt_target: "mes_code"
    note: "Material.mes_code = MPLA_ID（'MP-'+matnr，对象定义物化自 MES.MPLA，计算态）"
  - source_table: "mes.MPLA"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "MPLA.MATNR 跨系统 join key → Material.matnr（1:1 对齐 MARA 主码）"
  - source_table: "mes.MPLA"
    source_field: "MPLA_ID"
    kind: "link"
    gt_target: "material.codes"
    note: "mes 码空间 → Code 行（materialize._CODES_SQL code_space=mes），hasCode 归属"
  - source_table: "mes.AUFK"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "AUFK 生产工单物料引用 → Material.matnr（引用映射）"
  - source_table: "mes.AUFK"
    source_field: "WERKS"
    kind: "attribute"
    gt_target: "factory"
    note: "AUFK.WERKS 工厂 → InventoryLocation.factory（引用映射）"
  - source_table: "mes.AFPO"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "AFPO 工单项目物料引用 → Material.matnr（引用映射）"
  - source_table: "mes.AFPO"
    source_field: "MEINS"
    kind: "attribute"
    gt_target: "base_unit"
    note: "AFPO.MEINS 随物料复制 MARA.MEINS → Material.base_unit（引用映射）"
  - source_table: "mes.COFV"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "COFV 报工流水物料引用 → Material.matnr（引用映射）"
  - source_table: "mes.COFV"
    source_field: "WERKS"
    kind: "attribute"
    gt_target: "factory"
    note: "COFV.WERKS 工厂 → InventoryLocation.factory（引用映射）"

  # ============ wms 系统 ============
  - source_table: "wms.WMMD"
    source_field: "MATNR"
    kind: "object"
    gt_target: "Material"
    note: "WMMD 仓储侧物料主档 → Material 对象（WMS 视图，MATNR 即主键）"
  - source_table: "wms.WMMD"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "WMMD.MATNR 即主码 → Material.matnr（跨系统 join key）"
  - source_table: "wms.WMMD"
    source_field: "MEINS"
    kind: "attribute"
    gt_target: "base_unit"
    note: "WMMD.MEINS 复制 MARA.MEINS（门禁 D3 对齐）→ Material.base_unit"
  - source_table: "wms.WMMD"
    source_field: "MATNR"
    kind: "link"
    gt_target: "material.codes"
    note: "wms 采用主码（设计 §1.3），WMMD.MATNR 主码 → hasCode 编码归属（保守，wms 码空间由主码承载）"
  - source_table: "wms.MSEG"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "MSEG 库存流水物料引用 → Material.matnr（引用映射）"
  - source_table: "wms.MSEG"
    source_field: "MEINS"
    kind: "attribute"
    gt_target: "base_unit"
    note: "MSEG.MEINS 随物料复制 MARA.MEINS → Material.base_unit（引用映射）"
  - source_table: "wms.MSEG"
    source_field: "WERKS"
    kind: "attribute"
    gt_target: "factory"
    note: "MSEG.WERKS 工厂 → InventoryLocation.factory（引用映射）"
  - source_table: "wms.MSEG"
    source_field: "LGORT"
    kind: "attribute"
    gt_target: "location"
    note: "MSEG.LGORT 库存地点 → InventoryLocation.location（引用映射，权威列 WMS.MSEG.LGORT）"

  # ============ scm 系统 ============
  - source_table: "scm.LFA1"
    source_field: "LIFNR"
    kind: "object"
    gt_target: "Vendor"
    note: "LFA1 供应商主数据 → Vendor 对象（des_objects.py source_table=scm.LFA1，PK=LIFNR）"
  - source_table: "scm.LFA1"
    source_field: "LIFNR"
    kind: "attribute"
    gt_target: "vendor_id"
    note: "Vendor.vendor_id 权威列 SCM.LFA1.LIFNR（供应商号）"
  - source_table: "scm.LFA1"
    source_field: "NAME1"
    kind: "attribute"
    gt_target: "name"
    note: "Vendor.name 权威列 SCM.LFA1.NAME1（供应商名称）"
  - source_table: "scm.LFA1"
    source_field: "ORT01"
    kind: "attribute"
    gt_target: "city"
    note: "Vendor.city 权威列 SCM.LFA1.ORT01（所在城市）"
  - source_table: "scm.LFA1"
    source_field: "LAND1"
    kind: "attribute"
    gt_target: "country"
    note: "Vendor.country 权威列 SCM.LFA1.LAND1（国家/地区）"
  - source_table: "scm.EKKO"
    source_field: "LIFNR"
    kind: "attribute"
    gt_target: "vendor_id"
    note: "EKKO 采购订单供应商 FK → Vendor.vendor_id（引用映射）"
  - source_table: "scm.EKPO"
    source_field: "MATNR"
    kind: "attribute"
    gt_target: "matnr"
    note: "EKPO 采购订单项目物料引用 → Material.matnr（引用映射）"
  - source_table: "scm.EKPO"
    source_field: "MEINS"
    kind: "attribute"
    gt_target: "base_unit"
    note: "EKPO.MEINS 随物料复制 MARA.MEINS → Material.base_unit（引用映射）"

  # ============ fin 系统 ============
  - source_table: "fin.ACDOCA"
    source_field: "BELNR"
    kind: "object"
    gt_target: "FinanceEntry"
    note: "ACDOCA 财务日记账 → FinanceEntry 对象（des_objects.py source_table=fin.ACDOCA，PK=BELNR+POSNR）"
  - source_table: "fin.ACDOCA"
    source_field: "BELNR"
    kind: "attribute"
    gt_target: "belnr"
    note: "FinanceEntry.belnr 权威列 FIN.ACDOCA.BELNR（会计凭证号）"
  - source_table: "fin.ACDOCA"
    source_field: "POSNR"
    kind: "attribute"
    gt_target: "posnr"
    note: "FinanceEntry.posnr 权威列 FIN.ACDOCA.POSNR（凭证行项目）"
  - source_table: "fin.ACDOCA"
    source_field: "RACCT"
    kind: "attribute"
    gt_target: "account"
    note: "FinanceEntry.account 权威列 FIN.ACDOCA.RACCT（会计科目，指标维度 account）"
  - source_table: "fin.ACDOCA"
    source_field: "KOSTL"
    kind: "attribute"
    gt_target: "cost_center"
    note: "FinanceEntry.cost_center 权威列 FIN.ACDOCA.KOSTL（成本中心，指标维度）"
  - source_table: "fin.ACDOCA"
    source_field: "WSL"
    kind: "attribute"
    gt_target: "amount"
    note: "FinanceEntry.amount 权威列 FIN.ACDOCA.WSL（金额，借正/贷负，指标度量）"
  - source_table: "fin.ACDOCA"
    source_field: "BUDAT"
    kind: "attribute"
    gt_target: "post_date"
    note: "FinanceEntry.post_date 权威列 FIN.ACDOCA.BUDAT（过账日期，指标月维度源）"
  - source_table: "fin.ACDOCA"
    source_field: "REF_TYPE"
    kind: "attribute"
    gt_target: "ref_type"
    note: "FinanceEntry.ref_type 权威列 FIN.ACDOCA.REF_TYPE（参考单据类型 SO/PO/MV，指标维度）"
