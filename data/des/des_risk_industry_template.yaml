# des_risk_industry_template.yaml —— 金融风控行业模板（新增行业层，安平金控 ap_anping 继承本层）
# 依据 docs/S3-M1b-DES金融化设计-v1.md（§一 目录 / §二 6 系统 / §三 行分布）+ docs/S3-M1a-字段脱敏映射-全量42表.json（字段）
# + docs/S3-安平金控-业务规则建模-v1.md（DMN 规则 1-7：预警等级/五级分类/集中度/编码）。
# M1b 全量补全：脊柱 12 表 + 全量 42 表 = 54 张核心业务表注册表（kind/pk/depends_on/fk/row_count）。
# 表名/字段名一律用脱敏名（ap_*，与脊柱一致）；原型表名（o_a_erms_*/p_erms_*/o_base_*/o_sys_*/erms_*）
# 只作溯源注释（source_table），不出现在库表名/字段名（S3-M1a 选表脱敏清单 待办 3 门禁）。
# 行数口径：核心业务表（客户关系/押品/共债/集中度预警/衍生/背离/资产/投资/审批待办等）每表 1k-8k 行；
# 支撑表（日志/参数/流水号/字典/机构/用户等）每表 50-500 行；Σ 12+42 = 376301（口径包§五：预警信号~2 万、客户~5 万）。
industry: financial_risk_control
template_version: "0.1"
data_version: "S4-1"            # 数据版本（S4-1 = 口径包 v0.3 再生成：中文枚举/偏态分布/剧本道具；参与 config_sha256）
total_target: 371301            # Σ 54 表 row_count（口径包§五：信号~2 万/客户~5 万 + 剧本道具，§三 总门禁）

coding: &coding
  # 机验占位符（validate 要求 {YYYY}/{NNNN}/{CCC} 齐全）；金融实际编码见 DMN 规则 4：
  # CUST-{YYYY}-{6位} / GRP-{YYYY}-{6位} / SGN-{YYYY}-{8位} / APP-{YYYY}-{8位} / PROJ-{YYYY}-{8位} / COL-{YYYY}-{8位} / DSP-{YYYY}-{8位}
  master_pattern: "CUST-{YYYY}-{NNNN}-{CCC}"
  year: 2026

storage:
  layout: "one_enterprise_one_dir"   # 1 企业=1 目录，N 系统=N SQLite 文件（复用 S2 约定）

seed_policy: fixed                   # 确定性锚：固定 seed（ap_anping seed=20260827）

# —— 表注册表（54 张核心业务表，6 系统）——
# kind: master 主数据 / transaction 事务；row_count 精确行数；pk 主键列；
# depends_on 生成拓扑依赖；fk 字段级外键声明（同库/跨库，供 D 门禁与本体语义层校验）。
enterprise:
  systems:
    customer:
      db: customer.db
      tables:
        ap_group_customer:            # 脊柱 12（row_count 含 3 剧本道具集团：天晟/恒昌/瑞华）
          kind: master
          row_count: 8003
          pk: [group_customer_no]
          depends_on: []
          fk: {}
        ap_customer:                  # 脊柱 12（row_count 含 3 剧本道具客户：天晟实业/恒昌贸易/瑞华实业）
          kind: master
          row_count: 50003
          pk: [customer_id]
          depends_on: [customer.ap_group_customer]
          fk: {group_customer_no: customer.ap_group_customer}
        # —— M1b 新增（全量 42）——
        # 客户关系域（o_a_erms_cust_relation / cust_relation_opt / cust_list / top500_cust_info）
        ap_customer_relation:
          kind: master
          row_count: 4003  # +3 恒昌↔天晟 隐性一致行动人线索切片（股权代持/交叉担保/资金往来）
          pk: [customer_relation_id]
          depends_on: [customer.ap_customer]
          fk: {internal_customer_no: customer.ap_customer}
        ap_customer_relation_tree:
          kind: master
          row_count: 3003  # +3 恒昌三条识别线索（股权代持线索/交叉担保链/资金往来异动）
          pk: [customer_relation_tree_id]
          depends_on: [customer.ap_customer]
          fk: {internal_customer_no: customer.ap_customer}
        ap_important_customer_list:
          kind: master
          row_count: 1500
          pk: [important_customer_id]
          depends_on: [customer.ap_group_customer]
          fk: {group_customer_name: customer.ap_group_customer}
        ap_top500_customer_risk:
          kind: master
          row_count: 500
          pk: [top500_customer_id]
          depends_on: [customer.ap_customer, customer.ap_group_customer]
          fk: {customer_no: customer.ap_customer, group_customer_no: customer.ap_group_customer}
        # 资产/投融资域（o_a_erms_cust_assets / cust_sub_org_invest / credit_detail_1）
        ap_customer_assets:
          kind: master
          row_count: 6000
          pk: [customer_assets_id]
          depends_on: [customer.ap_customer]
          fk: {customer_no: customer.ap_customer}
        ap_customer_invest_dist:
          kind: master
          row_count: 5000
          pk: [customer_invest_dist_id]
          depends_on: [customer.ap_customer]
          fk: {customer_no: customer.ap_customer}
        ap_subsidiary_credit_detail:
          kind: transaction
          row_count: 8005  # +5 剧本道具：天晟(银行48/证券22/资管16.4) + 恒昌16 + 瑞华75.2（亿元）
          pk: [project_id]
          depends_on: [customer.ap_group_customer, customer.ap_customer]
          fk: {group_customer_name: customer.ap_group_customer}
        # 押品域（o_a_erms_negot_info / org_mrtg_prop_info / pledge_bankdetail / pledge_securitiesdetail）
        ap_collateral:
          kind: master
          row_count: 4000
          pk: [collateral_id]
          depends_on: [customer.ap_customer, customer.ap_group_customer]
          fk: {customer_name: customer.ap_customer, group_customer_name: customer.ap_group_customer}
        ap_subsidiary_mortgage:
          kind: master
          row_count: 3000
          pk: [subsidiary_mortgage_id]
          depends_on: [customer.ap_customer]
          fk: {customer_name: customer.ap_customer}
        ap_bank_pledge_detail:
          kind: transaction
          row_count: 3000
          pk: [bank_pledge_id]
          depends_on: [customer.ap_customer, customer.ap_group_customer]
          fk: {customer_credit_code: customer.ap_customer, group_customer_name: customer.ap_group_customer}
        ap_securities_pledge_detail:
          kind: transaction
          row_count: 2000
          pk: [securities_pledge_id]
          depends_on: [customer.ap_customer]
          fk: {customer_credit_code: customer.ap_customer}
    risk:
      db: risk.db
      tables:
        ap_warning_signal:            # 脊柱 12（口径包§五：信号 ~2 万，含 3 剧本预警：天晟橙/天晟红/瑞华黄）
          kind: transaction
          row_count: 20003
          pk: [warning_id]
          depends_on: [customer.ap_customer, customer.ap_group_customer]
          fk: {customer_id: customer.ap_customer, group_customer_no: customer.ap_group_customer}
        ap_warning_disposal:          # 脊柱 12（+3 剧本处置：天晟橙/天晟红处置中、瑞华黄已处置闭环）
          kind: transaction
          row_count: 20003
          pk: [disposal_id]
          depends_on: [risk.ap_warning_signal]
          fk: {warning_id: risk.ap_warning_signal}
        ap_disposal:                  # 脊柱 12（处置批次主单按信号数上限对齐：信号 2 万）
          kind: transaction
          row_count: 20000
          pk: [disposal_id]
          depends_on: [risk.ap_warning_signal]
          fk: {}
        ap_disposal_detail:           # 脊柱 12（保留，不改）
          kind: transaction
          row_count: 10000
          pk: [disposal_detail_id]
          depends_on: [risk.ap_disposal, risk.ap_warning_signal]
          fk: {batch_id: risk.ap_disposal, signal_id: risk.ap_warning_signal}
        # —— M1b 新增（全量 42）——
        # 预警推送（o_a_erms_cust_warn_sgn_push）
        ap_warning_push:
          kind: transaction
          row_count: 8000
          pk: [warning_push_id]
          depends_on: [risk.ap_warning_signal]
          fk: {warning_id: risk.ap_warning_signal}
        # 合规/审计域（o_a_erms_audit_detail / compliance_risk_ledger(+tmp) / custd_pnsh）
        ap_audit_detail:
          kind: transaction
          row_count: 2000
          pk: [audit_id]
          depends_on: []
          fk: {}
        ap_compliance_risk_ledger:
          kind: master
          row_count: 1000
          pk: [compliance_risk_id]
          depends_on: []
          fk: {}
        ap_compliance_risk_ledger_tmp:
          kind: master
          row_count: 300
          pk: [compliance_risk_tmp_id]
          depends_on: []
          fk: {}
        ap_regulatory_penalty:
          kind: master
          row_count: 1500
          pk: [penalty_id]
          depends_on: []
          fk: {}
        # 预警派生域（p_erms_cust_warn_sgn_concentration / derive / derive_deal_detail / derive_sub_push / deviation / deviation_cust_warn_score）
        ap_warn_signal_concentration:
          kind: transaction
          row_count: 6000
          pk: [concentration_signal_id]
          depends_on: [customer.ap_top500_customer_risk, customer.ap_customer, customer.ap_group_customer]
          fk: {top500_customer_id: customer.ap_top500_customer_risk, customer_no: customer.ap_customer, group_customer_no: customer.ap_group_customer}
        ap_warn_signal_derive:
          kind: transaction
          row_count: 8000
          pk: [derive_warning_id]
          depends_on: [customer.ap_customer, approval.ap_approve_order]
          fk: {customer_id: customer.ap_customer, approve_order_id: approval.ap_approve_order}
        ap_warn_derive_deal_detail:
          kind: transaction
          row_count: 4000
          pk: [derive_deal_detail_id]
          depends_on: [risk.ap_warn_signal_derive]
          fk: {derive_warning_id: risk.ap_warn_signal_derive}
        ap_warn_derive_sub_push:
          kind: transaction
          row_count: 5000
          pk: [derive_sub_push_id]
          depends_on: [risk.ap_warn_signal_derive, customer.ap_customer]
          fk: {derive_warning_id: risk.ap_warn_signal_derive, customer_id: customer.ap_customer}
        ap_warn_signal_deviation:
          kind: transaction
          row_count: 6000
          pk: [deviation_signal_id]
          depends_on: [customer.ap_customer, customer.ap_group_customer, approval.ap_approve_order]
          fk: {customer_no: customer.ap_customer, group_customer_no: customer.ap_group_customer, approve_order_id: approval.ap_approve_order}
        ap_deviation_warn_score:
          kind: master
          row_count: 3000
          pk: [deviation_warn_score_id]
          depends_on: [customer.ap_group_customer]
          fk: {group_customer_name: customer.ap_group_customer}
    concentration:
      db: concentration.db
      tables:
        ap_concentration_limit:       # 脊柱 12（+2 剧本集中度：天晟 10.8% 橙 / 瑞华 9.4% 黄）
          kind: master
          row_count: 8002
          pk: [concentration_limit_id]
          depends_on: [customer.ap_customer]
          fk: {customer_no: customer.ap_customer}
        # —— M1b 新增（全量 42）——
        # 集中度限额/预警调整（o_a_erms_larg_cust_limit_adj / larg_cust_warn_adj）
        ap_concentration_limit_adj:
          kind: transaction
          row_count: 3000
          pk: [concentration_limit_adj_id]
          depends_on: [concentration.ap_concentration_limit, customer.ap_customer]
          fk: {concentration_limit_id: concentration.ap_concentration_limit, customer_no: customer.ap_customer}
        ap_concentration_warn_adj:
          kind: transaction
          row_count: 3000
          pk: [concentration_warn_adj_id]
          depends_on: [concentration.ap_concentration_limit, customer.ap_customer]
          fk: {concentration_limit_id: concentration.ap_concentration_limit, customer_no: customer.ap_customer}
        # 共债域（p_erms_codebt_cust_info / codebt_cust_warn_score）
        ap_codebt_customer:
          kind: master
          row_count: 3000
          pk: [codebt_customer_id]
          depends_on: [customer.ap_customer]
          fk: {customer_name: customer.ap_customer}
        ap_codebt_warn_score:
          kind: master
          row_count: 4000
          pk: [codebt_warn_score_id]
          depends_on: [customer.ap_customer]
          fk: {customer_name: customer.ap_customer}
    approval:
      db: approval.db
      tables:
        ap_approve_node:              # 脊柱 12（保留，不改）
          kind: master
          row_count: 2000
          pk: [approve_node_id]
          depends_on: []
          fk: {}
        ap_approve_order:             # 脊柱 12（保留，不改）
          kind: transaction
          row_count: 20000
          pk: [approve_order_id]
          depends_on: [risk.ap_warning_signal]
          fk: {}
        ap_approve_task:              # 脊柱 12（保留，不改）
          kind: transaction
          row_count: 30000
          pk: [approve_task_id]
          depends_on: [approval.ap_approve_order, approval.ap_approve_node]
          fk: {approve_order_id: approval.ap_approve_order, approve_node_id: approval.ap_approve_node}
        # —— M1b 新增（全量 42）——
        # 审批域（p_erms_approve_oper_log / approve_order_warn_rel / approve_todo）
        ap_approve_oper_log:
          kind: transaction
          row_count: 4000
          pk: [approve_log_id]
          depends_on: [approval.ap_approve_order, approval.ap_approve_task]
          fk: {approve_order_id: approval.ap_approve_order, approve_task_id: approval.ap_approve_task}
        ap_approve_warn_rel:
          kind: transaction
          row_count: 6000
          pk: [approve_warn_rel_id]
          depends_on: [approval.ap_approve_order, risk.ap_warning_signal]
          fk: {approve_order_id: approval.ap_approve_order, warning_id: risk.ap_warning_signal}
        ap_approve_todo:
          kind: transaction
          row_count: 5000
          pk: [approve_todo_id]
          depends_on: [approval.ap_approve_task]
          fk: {approve_task_id: approval.ap_approve_task}
    project:
      db: project.db
      tables:
        ap_risk_project:              # 脊柱 12（保留，不改）
          kind: transaction
          row_count: 5000
          pk: [risk_project_id]
          depends_on: [customer.ap_group_customer, customer.ap_customer]
          fk: {}
        # —— M1b 新增（全量 42）——
        # 风险项目域支撑（p_erms_top_query_log / p_serial_number_counter）
        ap_cust_query_log:
          kind: transaction
          row_count: 500
          pk: [cust_query_log_id]
          depends_on: []
          fk: {}
        ap_serial_counter:
          kind: master
          row_count: 365
          pk: [serial_counter_id]
          depends_on: []
          fk: {}
    base:
      db: base.db
      tables:
        ap_dim_metric:                # 脊柱 12（保留，不改）
          kind: transaction
          row_count: 50000
          pk: [dim_metric_id]
          depends_on: [customer.ap_customer, customer.ap_group_customer]
          fk: {}
        # —— M1b 新增（全量 42）——
        # 指标/排名域（o_a_erms_index_list_std / dim_rank）
        ap_metric_std:
          kind: master
          row_count: 6000
          pk: [index_id]
          depends_on: []
          fk: {}
        ap_dim_rank:
          kind: master
          row_count: 5000
          pk: [dim_rank_id]
          depends_on: [customer.ap_customer, customer.ap_group_customer]
          fk: {customer_no: customer.ap_customer, group_customer_no: customer.ap_group_customer}
        # 支撑域（o_a_erms_custom_param / pref_info_file_tab / supervise_opinion_classify / top_query_log
        #          o_base_ddct / o_base_stm_parm / o_sys_organization / o_sys_user / erms_dict_biz）
        ap_custom_param:
          kind: master
          row_count: 500
          pk: [custom_param_id]
          depends_on: []
          fk: {}
        ap_preference_file:
          kind: master
          row_count: 500
          pk: [preference_file_id]
          depends_on: []
          fk: {}
        ap_supervise_opinion:
          kind: master
          row_count: 300
          pk: [supervise_opinion_id]
          depends_on: []
          fk: {}
        ap_top_query_log:
          kind: transaction
          row_count: 500
          pk: [top_query_log_id]
          depends_on: []
          fk: {}
        ap_data_dict:
          kind: master
          row_count: 500
          pk: [dict_id]
          depends_on: []
          fk: {}
        ap_sys_param:
          kind: master
          row_count: 311  # +11 资本常量（口径包§一：并表 800 亿/银行 600/480/60/证券 5.5%/资管 8.2%/R1a 三线）
          pk: [sys_param_id]
          depends_on: []
          fk: {}
        ap_org:
          kind: master
          row_count: 100
          pk: [org_id]
          depends_on: []
          fk: {}
        ap_user:
          kind: master
          row_count: 500
          pk: [user_id]
          depends_on: []
          fk: {}
        ap_biz_dict:
          kind: master
          row_count: 400
          pk: [biz_dict_id]
          depends_on: []
          fk: {}
