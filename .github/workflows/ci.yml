# OntoRun 轻 CI（S1 收口后准备件，按 AGENTS.md「P6 收口后建轻 CI」）。
#
# 状态：**准备件（write-ready，GitHub 推送前不触发）**——仓库尚未发布到 GitHub
# 远端（本地 git 为单一事实来源，发布须 Jack 确认）。推送到 GitHub 后本文件自动生效。
#
# 门禁（对齐 scripts/run_gates.sh + 蓝图 §12 验收）：
#   - lint：ruff check src/ tests/
#   - 后端 pytest（排除 slow/live 标记——slow 门禁由阶段末 Rose 跑，CI 不跑百万行规模）
#   - 前端 vitest（pnpm run test；前端依赖用 pnpm，锁文件 = web/pnpm-lock.yaml）
# 注：全量 pytest（含 slow）仅阶段末 Rose 门禁跑；子代理/日常增量仍走 run_gates.sh。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: python -m pip install -r requirements.txt
      - name: Ruff check
        run: ruff check src/ tests/

  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: python -m pip install -r requirements.txt
      - name: Generate seed databases (module-level create_app needs default dbs; *.db regenerable, gitignored)
        run: |
          mkdir -p data/sources data/ontology
          python data/seed_retail_source.py
      - name: Generate DES enterprise databases (hc_precision full-scale, needed by des tests; *.db regenerable)
        run: python -m src.des --enterprise hc_precision
      - name: Pytest (exclude slow/live)
        run: python -m pytest tests/ -q -m "not slow and not live"

  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend deps
        run: cd web && pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
      - name: Vitest
        run: cd web && pnpm run test
